<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Ski Calc"><meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#12171d" media="(prefers-color-scheme: dark)"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ski Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-column field tool, tab strip up top, panels like stamped steel plates */
:root{
  --bg:#eef1f4; --plate:#ffffff; --line:#cdd4dc; --fg:#1b2430; --muted:#5d6977;
  --accent:#e8a317; --accent-ink:#1b2430; --key:#e3e8ee; --key-op:#2f4a66; --key-op-ink:#ffffff;
  --mark:#c0392b; --pipe:#9aa6b3;
  --display:"Barlow Condensed", "Arial Narrow", sans-serif;
  --body:"Barlow", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --plate:#1b222b; --line:#2e3a47; --fg:#e6ebf0; --muted:#94a1af;
  --accent:#f0b429; --accent-ink:#12171d; --key:#26303b; --key-op:#3d6a96; --key-op-ink:#ffffff;
  --mark:#ff6b5b; --pipe:#6f7d8c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --plate:#1b222b; --line:#2e3a47; --fg:#e6ebf0; --muted:#94a1af;
  --accent:#f0b429; --accent-ink:#12171d; --key:#26303b; --key-op:#3d6a96; --key-op-ink:#ffffff;
  --mark:#ff6b5b; --pipe:#6f7d8c; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg);height:100%;overflow:hidden;overscroll-behavior:none}
html{box-sizing:border-box}
body{font-family:var(--body);font-size:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;margin:0;touch-action:manipulation}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;height:100%}
header,nav{flex-shrink:0}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:700;font-size:28px;white-space:nowrap;letter-spacing:.02em;margin:0;text-transform:uppercase}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;text-align:right}
@media (max-width:420px){.sub{display:none}}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--plate);border:1px solid var(--line);border-radius:10px;padding:4px}
nav button{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:0;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:clip;border:0;background:transparent;color:var(--muted);padding:10px 2px;border-radius:7px;cursor:pointer;min-width:0}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.plate{background:var(--plate);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.plate>*{flex-shrink:0}
#calc{overflow:hidden;gap:10px;padding:12px}
#calc>.keys{flex:1 1 auto;min-height:0;grid-template-rows:repeat(5,minmax(44px,1fr)) minmax(48px,.9fr)}
#calc .history{max-height:62px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-family:var(--body);font-weight:600;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--fg);padding:7px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
input,select{font-family:var(--mono);font-size:17px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box;min-width:0}
/* iPhone Safari gives date/time boxes a fixed built-in width; make them fit their column */
input[type=date],input[type=time],input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-width:0;min-height:46px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value,input[type=datetime-local]::-webkit-date-and-time-value{text-align:left;margin:0}
.field>input{max-width:100%}
.hint{font-size:12px;color:var(--muted)}
.results{display:flex;flex-direction:column;border-top:2px solid var(--fg)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row .k{color:var(--muted);font-size:14px}
.row .v{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.row.big .v{font-size:22px;color:var(--fg)}
.row.big .k{color:var(--fg);font-weight:600}
.v small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
svg.pipe{width:100%;height:auto;display:block}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
/* calculator */
.screen{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 18px;text-align:right;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden}
.expr{font-family:var(--mono);color:var(--muted);font-size:20px;min-height:20px;overflow:hidden}
.out{font-family:var(--mono);font-size:clamp(40px,12vw,54px);line-height:1.1;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all}
.out small{display:block;font-size:15px;font-weight:400;color:var(--muted);font-family:var(--body);margin-top:4px}
.out .ans{display:inline-flex;align-items:center;gap:.05em}
.approx-sign{font-size:.6em;color:var(--muted);margin-right:.15em}
.out .dim,.dim{color:var(--muted)}
.out .msg{font-size:20px;color:var(--muted);font-family:var(--body)}
.expr{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:0 .05em}
.expr .op{margin:0 .25em}
/* textbook fractions */
.fr{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle;text-align:center;margin:0 .1em;line-height:1.05}
.frn{border-bottom:.07em solid currentColor;padding:0 .18em .06em}
.frd{padding:.06em .18em 0}
.mx{display:inline-flex;align-items:center;gap:.08em}
.fr.sm,.out .fr{font-size:.6em}
.out .mx .fr.sm{font-size:.55em}
.expr .fr{font-size:.72em}
.ph{display:inline-block;width:.6em;height:.8em;border:1.5px dashed var(--muted);border-radius:2px;vertical-align:middle}

.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
.keys button{font-family:var(--mono);font-size:28px;min-height:0;padding:0;border:0;border-radius:14px;background:var(--key);color:var(--fg);cursor:pointer}
.keys button{transition:background-color .15s ease,color .15s ease,transform .08s ease}
.keys button.hit{transform:scale(.96);transition:none}
.keys button.hit:not(.op):not(.eq):not(.frk):not(.fn){background:var(--accent);color:var(--accent-ink)}
.keys button.hit.op,.keys button.hit.eq,.keys button.hit.fn,.keys button.hit.frk{filter:brightness(1.3)}
.screen.typing .expr{color:var(--fg);font-weight:600;line-height:1.15;min-height:1.2em}
.screen.typing .out{font-size:24px;font-weight:500;color:var(--muted);line-height:1.2}
.screen.typing .out .ans{font-size:inherit}
.screen.typing .out .fr{font-size:.75em}
.eqs{margin-right:.3em}
.out{white-space:nowrap;overflow:hidden}
.out small{white-space:normal}
.tk{display:inline-flex;align-items:center}
.tk.pop{animation:pop .28s ease-out}
.out.pop .ans{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(1.35);color:var(--accent)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.tk.pop,.out.pop .ans{animation:none}}
.keys .op{background:var(--key-op);color:var(--key-op-ink)}
.keys .eq{background:var(--accent);color:var(--accent-ink);font-weight:600}
.keys .fn{color:var(--accent);font-weight:600}
.keys .frk{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:20px;border:2px solid var(--accent);background:transparent;line-height:1.1}
.keys .frk.wide{grid-column:span 2;background:var(--accent);color:var(--accent-ink)}
.keys .frk.wide span{color:var(--accent-ink);opacity:.8;text-transform:none;letter-spacing:0}
.keys button:disabled{opacity:.45;cursor:default}
.keys .fkfr .fr{font-size:.62em}
.keys .frk b{font-weight:600}
.keys .frk i{font-style:normal;color:var(--accent)}
.keys .frk>span{font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.history{display:flex;flex-direction:column;gap:2px;max-height:150px;overflow-y:auto}
.history button{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:15px;background:transparent;border:0;color:var(--muted);padding:5px 0;cursor:pointer;text-align:left}
.history button b{color:var(--fg);font-weight:600}
.save{align-self:flex-start;font-family:var(--body);font-weight:600;font-size:14px;border:1px solid var(--fg);background:transparent;color:var(--fg);padding:9px 14px;border-radius:8px;cursor:pointer}
.save.done{background:var(--fg);color:var(--bg)}
.hbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.hlist{display:flex;flex-direction:column;gap:10px}
.hitem{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.htag{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--key);color:var(--fg)}
.htag.bend{background:var(--accent);color:var(--accent-ink)}
.htag.conv{background:var(--key-op);color:var(--key-op-ink)}
.htime{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.htitle{font-weight:600;overflow-wrap:anywhere}
.hlines{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.hlines span:nth-child(odd){color:var(--muted)}
.hlines span:nth-child(even){font-family:var(--mono);text-align:right;overflow-wrap:anywhere}
.hacts{display:flex;gap:8px;flex-wrap:wrap}
.hacts button,.linkbtn{font-family:var(--body);font-size:13px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--fg);padding:6px 11px;border-radius:6px;cursor:pointer}
.linkbtn.danger{color:var(--mark);border-color:var(--mark)}
.tcgrid{display:grid;grid-template-columns:2.4em minmax(0,1fr) minmax(0,1fr) 3.4em;gap:6px 5px;align-items:center}
.tcgrid input{font-size:14px;padding:8px 3px;text-align:center}
.tcgrid input::-webkit-calendar-picker-indicator{display:none}
.tcgrid label{font-size:11px}
.tcday{font-family:var(--display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.empty{color:var(--muted);text-align:center;padding:28px 8px;line-height:1.5}
@media (max-width:380px){.fields{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Ski <span>Calculator</span></h1>
    <div class="sub">Trade calculator</div>
  </header>

  <nav role="tablist">
    <button role="tab" id="tab-calc" aria-selected="true" data-panel="calc">Calc</button>
    <button role="tab" id="tab-bend" aria-selected="false" data-panel="bend">Bending</button>
    <button role="tab" id="tab-conv" aria-selected="false" data-panel="conv">Convert</button>
    <button role="tab" id="tab-hist" aria-selected="false" data-panel="hist">History</button>
  </nav>

  <!-- CALCULATOR -->
  <section id="calc" class="plate">
    <div class="screen"><div class="expr" id="expr"></div><div class="out" id="out">0</div></div>
    <div class="keys" id="keys">
      <button class="fn" data-k="C">C</button><button class="fn" data-k="(">(</button><button class="fn" data-k=")">)</button><button class="op" data-k="/">÷</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="*">×</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="-">−</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
      <button class="fn" data-k="back">⌫</button><button data-k="0">0</button><button data-k=".">.</button><button class="eq" data-k="=">=</button>
      <button class="frk" data-k="mix" aria-label="Whole number, then fraction"><b>12<i>▫</i></b><span>whole</span></button><button class="frk" data-k="frac" aria-label="Fraction bar"><b class="fkfr"><span class="fr"><span class="frn">▫</span><span class="frd">▫</span></span></b><span>fraction</span></button><button class="frk wide" id="fdkey" data-k="fd" aria-label="Switch between fraction and decimal"><b>F ⇄ D</b><span>mixed · fraction · decimal</span></button>
    </div>
  </section>

  <!-- BENDING -->
  <section id="bend" class="plate" hidden>
    <div class="seg" id="bendMode">
      <button aria-pressed="true" data-m="offset">Offset</button>
      <button aria-pressed="false" data-m="saddle3">3-pt saddle</button>
      <button aria-pressed="false" data-m="saddle4">4-pt saddle</button>
      <button aria-pressed="false" data-m="stub">90° stub</button>
      <button aria-pressed="false" data-m="rolling">Rolling offset</button>
    </div>
    <div class="fields" id="bendFields"></div>
    <svg class="pipe" id="pipe" viewBox="0 0 400 90" aria-hidden="true"></svg>
    <div class="results" id="bendOut"></div>
    <p class="note" id="bendNote"></p>
    <button class="save" id="saveBend">Save to history</button>
  </section>

  <!-- CONVERT -->
  <section id="conv" class="plate" hidden>
    <div class="field"><label for="convSearch" id="convSearchLab">Find a tool</label><input id="convSearch" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search tools: torque, roof, BMI, mortgage…"></div>
    <div class="field"><label for="convMode">What do you want to convert?</label>
      <select id="convMode">
        <optgroup label="Units">

          <option value="area">Area</option>
          <option value="volume">Volume &amp; cooking</option>
          <option value="weight">Weight</option>
          <option value="speed">Speed</option>
          <option value="time">Time</option>
          <option value="temp">Temperature</option>
          <option value="pressure">Pressure</option>
          <option value="energy">Energy</option>
          <option value="powerunit">Power</option>
          <option value="torque">Torque</option>
          <option value="angle">Angle</option>
          <option value="data">Data size</option>
          <option value="fuel">Fuel economy</option>
          <option value="force">Force</option>
          <option value="density">Density</option>
          <option value="freq">Frequency &amp; RPM</option>
          <option value="cooking">Cooking measures</option>

          <option value="typo">Typography (pt, px, pica)</option>
          <option value="datatrans">Data transfer speed</option>
          <option value="prefix">Metric prefixes</option>
        </optgroup>
        <optgroup label="Money">
          <option value="fx">Currency</option>
          <option value="loan">Loan payment</option>
          <option value="mortgage">Mortgage payment</option>
          <option value="amort">Amortization by year</option>
          <option value="autoloan">Auto loan</option>
          <option value="lease">Auto lease</option>

          <option value="simpleint">Simple interest</option>

          <option value="retire">Retirement savings</option>
          <option value="afford">House affordability</option>

<script>
const $ = s => document.querySelector(s);

/* ---------- shared helpers ---------- */
// Accepts 12, 12.5, 12 3/8, 3/8, 12-3/8, 5' 6", 5'6
function parseLen(str){
  if(str==null) return NaN;
  let s=String(str).trim().replace(/"/g,'');
  if(!s) return NaN;
  let feet=0;
  const ft=s.match(/^(-?\d+(?:\.\d+)?)\s*'\s*(.*)$/);
  if(ft){feet=parseFloat(ft[1]);s=ft[2].trim();if(!s) return feet*12;}
  s=s.replace(/(\d)-(?=\d+\/)/,'$1 ');
  let v, m;
  if((m=s.match(/^-?(?:\d+\.?\d*|\.\d+)$/))) v=parseFloat(s);
  else if((m=s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/))) v=(+m[2]+m[3]/m[4])*(m[1]?-1:1);
  else if((m=s.match(/^(-?)(\d+)\/(\d+)$/))) v=(m[2]/m[3])*(m[1]?-1:1);
  else return NaN;
  if(!isFinite(v)) return NaN;
  return feet<0 ? feet*12-v : feet*12+v;
}
function gcd(a,b){return b?gcd(b,a%b):a}
// inches -> 12 3/8" to nearest 1/16
function frac(x,den=16){
  if(!isFinite(x)) return '—';
  const neg=x<0; x=Math.abs(x);
  let whole=Math.floor(x), n=Math.round((x-whole)*den);
  if(n===den){whole++;n=0}
  let out='';
  if(n){const g=gcd(n,den); out=(whole?whole+' ':'')+(n/g)+'/'+(den/g);}
  else out=String(whole);
  return (neg?'-':'')+out+'"';
}
function ftIn(x){
  if(!isFinite(x)||Math.abs(x)<12) return '';
  const f=Math.floor(x/12), r=x-f*12;
  return `${f}' ${frac(r)}`;
}
const num=(x,d=3)=>isFinite(x)?(+x.toFixed(d)).toLocaleString('en-US',{maximumFractionDigits:d}):'—';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- exact fractions for the calculator ---------- */
const RAT=(()=>{
  const gcd=(a,b)=>{a=a<0n?-a:a;b=b<0n?-b:b;while(b){[a,b]=[b,a%b]}return a};
  const mk=(n,d)=>{if(d===0n)throw new Error('Divide by zero');if(d<0n){n=-n;d=-d}const g=gcd(n,d)||1n;return {n:n/g,d:d/g}};
  const fromDec=s=>{const [i,f='']=s.split('.');return mk(BigInt((i||'0')+f),10n**BigInt(f.length))};
  const add=(a,b)=>mk(a.n*b.d+b.n*a.d,a.d*b.d), sub=(a,b)=>mk(a.n*b.d-b.n*a.d,a.d*b.d), mul=(a,b)=>mk(a.n*b.n,a.d*b.d), div=(a,b)=>mk(a.n*b.d,a.d*b.n);
  function tokens(e){const out=[],re=/\s*(?:(\d+(?:\.\d+)?) (\d+)⁄(\d+)|(\d+)⁄(\d+)|(\d+\.?\d*|\.\d+)|([-+*/()]))/y;let m;re.lastIndex=0;
    while(re.lastIndex<e.length){const at=re.lastIndex;m=re.exec(e);if(!m){if(/^\s*$/.test(e.slice(at)))break;throw new Error('bad')}
      if(m[1])out.push({t:'n',v:add(fromDec(m[1]),mk(BigInt(m[2]),BigInt(m[3])))});
      else if(m[4])out.push({t:'n',v:mk(BigInt(m[4]),BigInt(m[5]))});
      else if(m[6])out.push({t:'n',v:fromDec(m[6])});
      else out.push({t:m[7]})}
    return out}
  function evaluate(e){const tk=tokens(e);let p=0;const pk=()=>tk[p]||{t:'end'};
    const ex=()=>{let v=te();while(pk().t==='+'||pk().t==='-'){const o=tk[p++].t;const r=te();v=o==='+'?add(v,r):sub(v,r)}return v};
    const te=()=>{let v=un();for(;;){const t=pk().t;if(t==='*'||t==='/'){p++;const r=un();v=t==='*'?mul(v,r):div(v,r)}else if(t==='('||t==='n'){v=mul(v,un())}else break}return v};
    const un=()=>{if(pk().t==='-'){p++;return mul(mk(-1n,1n),un())}if(pk().t==='+'){p++;return un()}return pr()};
    const pr=()=>{const k=pk();if(k.t==='n'){p++;return k.v}if(k.t==='('){p++;const v=ex();if(pk().t!==')')throw new Error('paren');p++;return v}throw new Error('end')};
    if(!tk.length)return mk(0n,1n);const v=ex();if(p<tk.length)throw new Error('extra');return v}
  const toNum=r=>Number(r.n)/Number(r.d);
  return {evaluate,toNum};
})();

/* ---------- history (shared) ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TYPES=['calc','bend','conv'];
let HIST=[];
try{HIST=(JSON.parse(localStorage.getItem('bb-history')||'[]')||[]).filter(x=>TYPES.includes(x.type))}catch(e){HIST=[]}
function saveHistStore(){try{localStorage.setItem('bb-history',JSON.stringify(HIST))}catch(e){}}
function addHist(e){
  e.id=Date.now()+Math.random().toString(36).slice(2,6); e.t=Date.now();
  HIST.unshift(e); HIST=HIST.slice(0,200); saveHistStore(); renderHist();
}
function snapshot(container){const o={};container.querySelectorAll('input[id],select[id]').forEach(el=>o[el.id]=el.value);return o}
function rowsToLines(container){
  return [...container.querySelectorAll('.row')].filter(r=>r.querySelector('.v')).map(r=>{
    const k=r.querySelector('.k').textContent.trim(), v=r.querySelector('.v');
    const main=[...v.childNodes].filter(n=>n.nodeName!=='SMALL').map(n=>n.textContent).join('').trim();
    const sub=v.querySelector('small')?.textContent.trim();
    return [k, sub?`${main} (${sub})`:main];
  });
}
function when(t){
  const d=new Date(t), now=new Date(), diff=(now-d)/1000;
  if(diff<60) return 'just now';
  if(diff<3600) return Math.floor(diff/60)+' min ago';
  const time=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  if(d.toDateString()===now.toDateString()) return 'Today '+time;
  return d.toLocaleDateString([], {month:'short',day:'numeric'})+' '+time;
}
let histFilter='all';
const TAGNAME={calc:'Calc',bend:'Bending',conv:'Convert'};
function renderHistPanel(){
  const list=HIST.filter(x=>histFilter==='all'||x.type===histFilter);
  $('#clearWrap').hidden=!HIST.length;
  if(!list.length){
    $('#hlist').innerHTML=`<div class="empty">${HIST.length?'Nothing saved in this category yet.':'No history yet.<br>Calculator answers are saved automatically.<br>On Bending and Convert, tap <b>Save to history</b>.'}</div>`;
    return;
  }
  $('#hlist').innerHTML=list.map(x=>`<article class="hitem">
    <div class="hhead"><span class="htag ${x.type}">${TAGNAME[x.type]}</span><span class="htime">${when(x.t)}</span></div>
    <div class="htitle">${esc(x.title)}</div>
    <div class="hlines">${x.lines.map(([k,v])=>`<span>${esc(k)}</span><span>${esc(v)}</span>`).join('')}</div>
    <div class="hacts"><button data-act="open" data-id="${x.id}">${x.type==='calc'?'Use answer':'Open'}</button><button data-act="copy" data-id="${x.id}">Copy</button><button data-act="del" data-id="${x.id}">Delete</button></div>
  </article>`).join('');
}
$('#hlist').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-act]'); if(!b) return;
  const x=HIST.find(h=>h.id===b.dataset.id); if(!x) return;
  if(b.dataset.act==='del'){HIST=HIST.filter(h=>h!==x);saveHistStore();renderHist();renderHistPanel();}
  else if(b.dataset.act==='copy'){
    const text=x.title+'\n'+x.lines.map(([k,v])=>`${k}: ${v}`).join('\n');
    let ok=false;
    try{await navigator.clipboard.writeText(text);ok=true}catch(err){}
    if(!ok){try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(err){}}
    b.textContent=ok?'Copied':'Copy failed';
    setTimeout(()=>b.textContent='Copy',1400);
  }
  else if(b.dataset.act==='open'){
    if(x.type==='calc'){expr=x.exact||String(x.value);last=null;viewMode=null;renderCalc();showTab('calc');}
    else if(x.type==='bend'){setBend(x.mode);restore('#bendFields',x.inputs);runBend();showTab('bend');}
    else {setConv(x.mode);restore('#convFields',x.inputs);runConv();showTab('conv');}
  }
});
function restore(sel,inputs){Object.entries(inputs||{}).forEach(([id,v])=>{const el=$(sel).querySelector('#'+CSS.escape(id));if(el)el.value=v})}
document.querySelectorAll('#histFilter button').forEach(b=>b.onclick=()=>{
  histFilter=b.dataset.f;
  document.querySelectorAll('#histFilter button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  renderHistPanel();
});
$('#clearWrap').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='clearAll') $('#clearWrap').innerHTML='<button class="linkbtn danger" id="clearYes">Delete all '+HIST.length+'</button> <button class="linkbtn" id="clearNo">Cancel</button>';
  else {
    if(b.id==='clearYes'){HIST=[];saveHistStore();renderHist();}
    $('#clearWrap').innerHTML='<button class="linkbtn" id="clearAll">Clear all</button>';
    renderHistPanel();
  }
});
function flashSaved(btn){btn.textContent='Saved ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='Save to history';btn.classList.remove('done')},1400)}

/* ---------- tabs ---------- */
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.panel)));
function showTab(id){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.panel===id));
  ['calc','bend','conv','hist'].forEach(p=>$('#'+p).hidden=p!==id);
  if(id==='hist') renderHistPanel();
  store.set('bb-tab',id);
}

/* ---------- calculator ---------- */
let expr='', last=null, viewMode=null;
const opMap={'*':'×','/':'÷','-':'−'};
function pretty(e){return e.replace(/[*/-]/g,c=>opMap[c]).replace(/⁄/g,'/')}
const ph='<span class="ph"></span>';
function sfrac(a,b,cls=''){return `<span class="fr ${cls}"><span class="frn">${a||ph}</span><span class="frd">${b||ph}</span></span>`}
// textbook view of what was typed
function exprHTML(e){
  const re=/(\d+(?:\.\d+)?) (\d*)(⁄?)(\d*)|(\d+)⁄(\d*)|(\d+\.?\d*|\.\d+)|([-+*/()])|(\s+)/g;let h='',m;
  while((m=re.exec(e))){
    if(m[1]!==undefined)h+=`<span class="tk"><span class="mx">${m[1]}${sfrac(m[2],m[4],'sm')}</span></span>`;
    else if(m[5]!==undefined)h+=`<span class="tk">${sfrac(m[5],m[6])}</span>`;
    else if(m[7]!==undefined)h+=`<span class="tk">${m[7]}</span>`;
    else if(m[8]!==undefined)h+='()'.includes(m[8])?`<span class="tk">${m[8]}</span>`:`<span class="tk op">${opMap[m[8]]||m[8]}</span>`;
  }
  return h;
}
function evalR(e){try{return RAT.evaluate(e)}catch(err){return null}}
function evalExpr(e){const r=evalR(e);return r?RAT.toNum(r):NaN}
const absB=x=>x<0n?-x:x;
function ratHTML(r,mode){
  const neg=r.n<0n,n=absB(r.n),d=r.d,s=neg?'−':'';
  if(d===1n)return s+n.toString();
  if(mode==='dec')return num(RAT.toNum(r),10);
  if(d>64n&&64n%d!==0n){ // not a tape-measure fraction: show nearest 1/64
    const v=Math.abs(RAT.toNum(r)),q=Math.round(v*64);if(q%64===0)return `≈ ${s}${q/64}`;
    let g_=64;{let x=q,y=64;while(y){[x,y]=[y,x%y]}g_=x}const nn=q/g_,dd=64/g_,w=Math.floor(nn/dd),rm=nn%dd;
    return `<span class="approx-sign">≈</span>${s}`+(mode==='mixed'&&w?`<span class="mx">${w}${sfrac(rm,dd,'sm')}</span>`:sfrac(nn,dd));}
  if(mode==='mixed'&&n>d){const w=n/d,rem=n%d;return `${s}<span class="mx">${w}${sfrac(rem,d,'sm')}</span>`}
  return s+sfrac(n,d);
}
const oddFrac=r=>r.d>64n&&64n%r.d!==0n;
function ratText(r,mode){const neg=r.n<0n,n=absB(r.n),d=r.d,s=neg?'-':'';
  if(d===1n)return s+n;if(mode==='dec')return num(RAT.toNum(r),10);
  if(mode==='mixed'&&n>d)return `${s}${n/d} ${n%d}/${d}`;return `${s}${n}/${d}`}
// how the answer is entered back into the calculator to keep going
function ratExpr(r,mode){const neg=r.n<0n,n=absB(r.n),d=r.d,s=neg?'-':'';
  if(d===1n)return s+n;if(mode==='dec')return String(+RAT.toNum(r).toFixed(10));
  if(mode==='mixed'&&n>d)return `${s}${n/d} ${n%d}⁄${d}`;return `${s}${n}⁄${d}`}
function defaultMode(e,r){if(!r||r.d===1n)return 'mixed';if(/\./.test(e)||r.d>1000000n)return 'dec';return 'mixed'}
const MODES=['mixed','improper','dec'];
let shownExpr='',prevLen=0;
function fitText(el,max,min){
  el.style.justifyContent='flex-start';el.style.fontSize=max+'px';el.style.flexWrap='nowrap';let size=max;
  while(el.scrollWidth>el.clientWidth+1&&size>min){size-=2;el.style.fontSize=size+'px'}
  if(el.scrollWidth>el.clientWidth+1)el.style.flexWrap='wrap';
  el.style.justifyContent='';
}
function renderCalc(){
  const scr=$('.screen'),ex=$('#expr'),out=$('#out');
  const big=Math.round(Math.min(56,Math.max(40,window.innerWidth*.13)));
  const typing=last===null&&expr!=='';
  scr.classList.toggle('typing',typing);
  ex.style.fontSize='';out.style.fontSize='';ex.style.flexWrap='';
  const r=expr?evalR(expr):{n:0n,d:1n};
  const mode=r?(viewMode||defaultMode(expr,r)):null;
  $('#fdkey').disabled=!r||r.d===1n;
  if(typing){
    ex.innerHTML=exprHTML(expr);
    fitText(ex,big,22);
    if(expr.length>prevLen){const t=ex.querySelector('.tk:last-child');if(t){t.classList.add('pop')}}
    const plain=/^-?[\d.]+$|^-?\d+(?: \d+)?⁄\d+$|^-?\d+ \d*$/.test(expr);

    calc(){const P=nv('en2_p')*{W:1,kW:1000,hp:745.699872,BTUh:0.29307107}[g('en2_u').value],t=nv('en2_t')*{h:3600,min:60,s:1,d:86400}[g('en2_tu').value],r=nv('en2_r');if(!isFinite(P)||!isFinite(t))return null;
      const J=P*t,kwh=J/3.6e6;const out=[['Energy',`${num(kwh,4)} kWh<small>${num(kwh*1000,2)} Wh</small>`,true],['Joules',fmt(J)+' J'],['BTU',num(J/1055.05585,2)],['Calories (kcal)',num(J/4184,2)],['Average power',`${num(P,2)} W<small>${num(P/1000,4)} kW</small>`]];
      if(isFinite(r))out.push(['Cost',money(kwh*r),true]);return out;}
  },
  battery:{
    fields:()=>inp('bt2_c','Capacity','3000')+sel('bt2_u','Capacity unit',[['mAh','mAh'],['Ah','Ah'],['Wh','Wh']],'mAh')+inp('bt2_v','Battery voltage','3.7')+inp('bt2_l','Load (watts, optional)','5')+inp('bt2_e','Usable % (optional)','85'),
    calc(){const c=nv('bt2_c'),u=g('bt2_u').value,V=nv('bt2_v'),L=nv('bt2_l'),e=(nv('bt2_e')||100)/100;if(!isFinite(c)||!isFinite(V)||V<=0)return null;
      const Wh=u==='Wh'?c:(u==='Ah'?c:c/1000)*V,Ah=Wh/V;const out=[['Energy',`${num(Wh,3)} Wh`,true],['Capacity',`${num(Ah*1000,0)} mAh<small>${num(Ah,3)} Ah</small>`,true],['Joules',num(Wh*3600,0)+' J']];
      if(isFinite(L)&&L>0)out.push(['Runtime at this load',hms(Wh*e/L),true],['Current draw',num(L/V,3)+' A']);out.push(['Airline carry-on limit',Wh<=100?'Under 100 Wh (usually allowed)':Wh<=160?'100–160 Wh (needs airline approval)':'Over 160 Wh (usually not allowed)']);return out;}
  },
  vdivider:{
    fields:()=>inp('vd_in','Input voltage (V)','12')+inp('vd_r1','R1 (top, Ω)','10000')+inp('vd_r2','R2 (bottom, Ω)','4700')+inp('vd_t','Or: output voltage you want (V)','')+hint('Vout = Vin × R2 ÷ (R1 + R2). Enter a target output to find R2 for your R1.'),
    calc(){const vi=nv('vd_in'),r1=nv('vd_r1'),r2=nv('vd_r2'),t=nv('vd_t');if(!isFinite(vi)||!isFinite(r1))return null;
      if(isFinite(t)&&t>0&&t<vi){const R2=r1*t/(vi-t);return [['R2 needed',ohms(R2),true],['Current',num(vi/(r1+R2)*1000,3)+' mA']]}
      if(!isFinite(r2))return null;const vo=vi*r2/(r1+r2),I=vi/(r1+r2);return [['Output voltage',num(vo,4)+' V',true],['Current',num(I*1000,4)+' mA'],['Ratio',num(r2/(r1+r2),4)],['Power in R1 / R2',`${num(I*I*r1*1000,2)} mW / ${num(I*I*r2*1000,2)} mW`]];}
  },
  voltjoule:{
    fields:()=>inp('vj_v','Voltage (V)','12')+inp('vj_q','Charge','1')+sel('vj_u','Charge unit',[['C','Coulombs'],['mAh','mAh'],['Ah','Ah'],['e','Electrons (e)']],'C')+hint('Energy = voltage × charge. 1 eV is the energy of one electron moved through 1 volt.'),
    calc(){const V=nv('vj_v'),q=nv('vj_q')*{C:1,mAh:3.6,Ah:3600,e:1.602176634e-19}[g('vj_u').value];if(!isFinite(V)||!isFinite(q))return null;const J=V*q;
      return [['Energy',fmt(J)+' J',true],['Electronvolts',fmt(J/1.602176634e-19)+' eV',true],['Watt-hours',fmt(J/3600)+' Wh'],['Charge',fmt(q)+' C']];}
  },
  dbm:{
    fields:()=>inp('db_v','Value','20')+sel('db_u','Unit',[['dBm','dBm'],['dBW','dBW'],['mW','mW'],['W','W']],'dBm'),
    calc(){const v=nv('db_v'),u=g('db_u').value;if(!isFinite(v))return null;const mW=u==='dBm'?10**(v/10):u==='dBW'?10**(v/10)*1000:u==='mW'?v:v*1000;if(mW<=0)return [['Power must be above 0','—']];
      return [['dBm',num(10*Math.log10(mW),3)+' dBm',u!=='dBm'],['dBW',num(10*Math.log10(mW/1000),3)+' dBW',u!=='dBW'],['Milliwatts',fmt(mW)+' mW'],['Watts',fmt(mW/1000)+' W'],['Microvolts at 50 Ω',fmt(Math.sqrt(mW/1000*50)*1e6)+' µV']];}
  },
  efficiency:{
    fields:()=>inp('ef_o','Output power','850')+inp('ef_i','Input power','1000')+hint('Use the same unit for both (W, kW, hp…).'),
    calc(){const o=nv('ef_o'),i=nv('ef_i');if(!isFinite(o)||!isFinite(i)||i<=0)return null;return [['Efficiency',num(o/i*100,2)+'%',true],['Lost as heat',`${num(i-o,3)}<small>${num((i-o)/i*100,2)}%</small>`]];}
  }
});

let convMode=store.get('bb-conv')||'length';
function setConv(m){
  convMode=m;store.set('bb-conv',m);
  $('#convMode').value=m;
  $('#convFields').innerHTML=CONV[m].fields();
  $('#convFields').querySelectorAll('input,select,textarea').forEach(el=>el.addEventListener('input',runConv));
  $('#convFields').querySelectorAll('button[id$="_go"]').forEach(b=>b.onclick=runConv);
  clearInterval(untilTimer);
  if(m==='until'){untilTimer=setInterval(()=>{if(!$('#conv').hidden&&convMode==='until')runConv()},1000);
    g('u_quick').onclick=e=>{const b=e.target.closest('button');if(!b)return;const n=new Date();let t;
      if(b.dataset.q==='17:00'){t=new Date(n.getFullYear(),n.getMonth(),n.getDate(),17,0)}
      else if(b.dataset.q==='fri'){t=new Date(n.getFullYear(),n.getMonth(),n.getDate(),17,0);while(t.getDay()!==5||t<n)t.setDate(t.getDate()+1)}
      else if(b.dataset.q==='ny'){t=new Date(n.getFullYear()+1,0,1,0,0)}
      else{t=new Date(n.getTime()+7*864e5)}
      g('u_date').value=isoDay(t);g('u_time').value=hhmm(t);g('u_label').value=b.textContent==='1 week'?'':b.textContent;runConv()}}
  if(m==='fx'){
    g('x_swap').onclick=()=>{const f=g('x_from').value;g('x_from').value=g('x_to').value;g('x_to').value=f;g('x_rate').value='';runConv()};
    g('x_ref').onclick=()=>{fxErr='';loadFX();runConv()};}
  if(m==='tz'){
    g('z_now').onclick=()=>{const p=tzParts(g('z_from').value,new Date());g('z_date').value=`${p.year}-${p.month}-${p.day}`;g('z_time').value=`${p.hour}:${p.minute}`;runConv()};
    g('z_swap').onclick=()=>{const f=g('z_from').value,t=g('z_to').value,[y,mo,d]=g('z_date').value.split('-').map(Number),[h,mi]=(g('z_time').value||'00:00').split(':').map(Number);
      const p=tzParts(t,zonedToDate(y,mo,d,h,mi,f));g('z_from').value=t;g('z_to').value=f;g('z_date').value=`${p.year}-${p.month}-${p.day}`;g('z_time').value=`${p.hour}:${p.minute}`;runConv()}}
  const tc=g('tc_clear'); if(tc) tc.onclick=()=>{$('#convFields').querySelectorAll('input').forEach(el=>{if(/^tc_(in|out|br)/.test(el.id))el.value=''});runConv()};
  runConv();
}
function runConv(){
  const r=CONV[convMode].calc();
  $('#convOut').innerHTML=!r?'<div class="row"><span class="k">Enter a number to convert.</span></div>':
    r.map(([k,v,big])=>`<div class="row${big?' big':''}"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
}
$('#convMode').addEventListener('change',e=>setConv(e.target.value));

const ALL_TOOLS=(()=>{const t=document.createElement('template');t.innerHTML=$('#convMode').innerHTML;return [...t.content.querySelectorAll('optgroup')].map(gp=>({label:gp.label,opts:[...gp.querySelectorAll('option')].map(o=>[o.value,o.textContent])}))})();
$('#convSearch').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase().split(/\s+/).filter(Boolean),sel_=$('#convMode');let n=0,first=null;
  const h=ALL_TOOLS.map(gp=>{const hits=gp.opts.filter(([v,t])=>q.every(w=>(t+' '+gp.label+' '+v+' '+(SEARCH_KW[v]||'')).toLowerCase().includes(w)));n+=hits.length;if(hits.length&&!first)first=hits[0][0];
    return hits.length?`<optgroup label="${esc(gp.label)}">${hits.map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join('')}</optgroup>`:''}).join('');
  sel_.innerHTML=h||'<option value="" disabled>No tools match</option>';
  $('#convSearchLab').textContent=q.length?`Find a tool · ${n} match${n===1?'':'es'}`:'Find a tool';
  if(!n)return;const still=[...sel_.options].some(o=>o.value===convMode);
  if(still)sel_.value=convMode;else setConv(first);
});

$('#saveBend').onclick=e=>{
  const lines=rowsToLines($('#bendOut')); if(!lines.length) return;
  const label=document.querySelector(`#bendMode button[data-m="${bendMode}"]`).textContent;
  const inputs=snapshot($('#bendFields'));
  const summary=[...$('#bendFields').querySelectorAll('input,select')].map(el=>{const l=$('#bendFields').querySelector(`label[for="${el.id}"]`);return l?`${l.textContent.replace(/ \(in\)/,'')} ${el.tagName==='SELECT'?el.selectedOptions[0].text.split(' (')[0]:el.value}`:''}).filter(Boolean).join(', ');
  addHist({type:'bend',title:`${label} · ${summary}`,lines,mode:bendMode,inputs});

};
$('#saveConv').onclick=e=>{
  const lines=rowsToLines($('#convOut')); if(!lines.length||lines[0][1]==='—') return;
  const label=$('#convMode').selectedOptions[0].text;
  const f=$('#convFields'), v=f.querySelector('#c_v'), u=f.querySelector('#c_u');
  const title = v&&u ? `${label} · ${v.value} ${u.selectedOptions[0].text}` : label;
  addHist({type:'conv',title,lines,mode:convMode,inputs:snapshot(f)});
  flashSaved(e.target);
};
