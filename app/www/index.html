<style>
/* Layout: one-column field tool, tab strip up top, panels like stamped steel plates */
:root{
  --bg:#eef1f4; --plate:#ffffff; --line:#cdd4dc; --fg:#1b2430; --muted:#5d6977;
  --accent:#e8a317; --accent-ink:#1b2430; --key:#e3e8ee; --key-op:#2f4a66; --key-op-ink:#ffffff;
  --mark:#c0392b; --pipe:#9aa6b3;
  --display:"Barlow Condensed", "Arial Narrow", sans-serif;
  --body:"Barlow", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --plate:#1b222b; --line:#2e3a47; --fg:#e6ebf0; --muted:#94a1af;
  --accent:#f0b429; --accent-ink:#12171d; --key:#26303b; --key-op:#3d6a96; --key-op-ink:#ffffff;
  --mark:#ff6b5b; --pipe:#6f7d8c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --plate:#1b222b; --line:#2e3a47; --fg:#e6ebf0; --muted:#94a1af;
  --accent:#f0b429; --accent-ink:#12171d; --key:#26303b; --key-op:#3d6a96; --key-op-ink:#ffffff;
  --mark:#ff6b5b; --pipe:#6f7d8c; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg);height:100%;overflow:hidden;overscroll-behavior:none}
html{box-sizing:border-box}
body{font-family:var(--body);font-size:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;margin:0;touch-action:manipulation}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;height:100%}
header,nav{flex-shrink:0}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:700;font-size:28px;white-space:nowrap;letter-spacing:.02em;margin:0;text-transform:uppercase}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;text-align:right}
@media (max-width:420px){.sub{display:none}}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--plate);border:1px solid var(--line);border-radius:10px;padding:4px}
nav button{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:0;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:clip;border:0;background:transparent;color:var(--muted);padding:10px 2px;border-radius:7px;cursor:pointer;min-width:0}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.plate{background:var(--plate);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.plate>*{flex-shrink:0}
#calc{overflow:hidden;gap:10px;padding:12px}
#calc>.keys{flex:1 1 auto;min-height:0;grid-template-rows:repeat(5,minmax(44px,1fr)) minmax(48px,.9fr)}
#calc .history{max-height:62px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-family:var(--body);font-weight:600;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--fg);padding:7px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
input,select{font-family:var(--mono);font-size:17px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box;min-width:0}
/* iPhone Safari gives date/time boxes a fixed built-in width; make them fit their column */
input[type=date],input[type=time],input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-width:0;min-height:46px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value,input[type=datetime-local]::-webkit-date-and-time-value{text-align:left;margin:0}
.field>input{max-width:100%}
.hint{font-size:12px;color:var(--muted)}
.results{display:flex;flex-direction:column;border-top:2px solid var(--fg)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row .k{color:var(--muted);font-size:14px}
.row .v{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.row.big .v{font-size:22px;color:var(--fg)}
.row.big .k{color:var(--fg);font-weight:600}
.v small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
svg.pipe{width:100%;height:auto;display:block}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
/* calculator */
.screen{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 18px;text-align:right;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden}
.expr{font-family:var(--mono);color:var(--muted);font-size:20px;min-height:20px;overflow:hidden}
.out{font-family:var(--mono);font-size:clamp(40px,12vw,54px);line-height:1.1;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all}
.out small{display:block;font-size:15px;font-weight:400;color:var(--muted);font-family:var(--body);margin-top:4px}
.out .ans{display:inline-flex;align-items:center;gap:.05em}
.approx-sign{font-size:.6em;color:var(--muted);margin-right:.15em}
.out .dim,.dim{color:var(--muted)}
.out .msg{font-size:20px;color:var(--muted);font-family:var(--body)}
.expr{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:0 .05em}
.expr .op{margin:0 .25em}
/* textbook fractions */
.fr{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle;text-align:center;margin:0 .1em;line-height:1.05}
.frn{border-bottom:.07em solid currentColor;padding:0 .18em .06em}
.frd{padding:.06em .18em 0}
.mx{display:inline-flex;align-items:center;gap:.08em}
.fr.sm,.out .fr{font-size:.6em}
.out .mx .fr.sm{font-size:.55em}
.expr .fr{font-size:.72em}
.ph{display:inline-block;width:.6em;height:.8em;border:1.5px dashed var(--muted);border-radius:2px;vertical-align:middle}

.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
.keys button{font-family:var(--mono);font-size:28px;min-height:0;padding:0;border:0;border-radius:14px;background:var(--key);color:var(--fg);cursor:pointer}
.keys button{transition:background-color .15s ease,color .15s ease,transform .08s ease}
.keys button.hit{transform:scale(.96);transition:none}
.keys button.hit:not(.op):not(.eq):not(.frk):not(.fn){background:var(--accent);color:var(--accent-ink)}

<script>
const $ = s => document.querySelector(s);

/* ---------- shared helpers ---------- */
// Accepts 12, 12.5, 12 3/8, 3/8, 12-3/8, 5' 6", 5'6
function parseLen(str){
  if(str==null) return NaN;
  let s=String(str).trim().replace(/"/g,'');
  if(!s) return NaN;
  let feet=0;
  const ft=s.match(/^(-?\d+(?:\.\d+)?)\s*'\s*(.*)$/);
  if(ft){feet=parseFloat(ft[1]);s=ft[2].trim();if(!s) return feet*12;}
  s=s.replace(/(\d)-(?=\d+\/)/,'$1 ');
  let v, m;
  if((m=s.match(/^-?(?:\d+\.?\d*|\.\d+)$/))) v=parseFloat(s);
  else if((m=s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/))) v=(+m[2]+m[3]/m[4])*(m[1]?-1:1);
  else if((m=s.match(/^(-?)(\d+)\/(\d+)$/))) v=(m[2]/m[3])*(m[1]?-1:1);
  else return NaN;
  if(!isFinite(v)) return NaN;
  return feet<0 ? feet*12-v : feet*12+v;
}
function gcd(a,b){return b?gcd(b,a%b):a}
// inches -> 12 3/8" to nearest 1/16
function frac(x,den=16){
  if(!isFinite(x)) return '—';
  const neg=x<0; x=Math.abs(x);
  let whole=Math.floor(x), n=Math.round((x-whole)*den);

function fmt(x,d=6){

function unitConv(cat){
  const U=UNITS[cat];
  return {
    fields:()=>inp('c_v','Value',U.val)+`<div class="field"><label for="c_u">From</label><select id="c_u">${Object.entries(U.u).map(([k,[n]])=>`<option value="${k}" ${k===U.def?'selected':''}>${n}</option>`).join('')}</select></div>`,
    calc(){
      const from=c_u.value;
      let v=(cat==='length'&&(from==='in'||from==='ft'))?parseLen(c_v.value):parseFloat(c_v.value);
      if(!isFinite(v)) return null;
      let base;
      if(cat==='speed'&&from==='min_mi') base=v>0?1609.344/(v*60):NaN;
      else if(cat==='speed'&&from==='min_km') base=v>0?1000/(v*60):NaN;
      else base=v*U.u[from][1];
      return Object.entries(U.u).map(([k,[n,f]])=>{
        let out;
        if(k==='min_mi') out=`${minSec(1609.344/base/60)} /mi`;
        else if(k==='min_km') out=`${minSec(1000/base/60)} /km`;
        else if(cat==='length'&&k==='in'){const i=base/f;out=`${fmt(i)} in<small>${frac(i)}</small>`}
        else if(cat==='length'&&k==='ft'){const ft=base/f;out=`${fmt(ft)} ft${Math.abs(ft)>=1&&Math.abs(ft)<1e5?`<small>${ftIn(ft*12)||''}</small>`:''}`}
        else out=fmt(base/f)+' '+k;
        return [n,out,k===from];
      });
    }
  };
}

      const a=tMin(g('d_in').value),b=tMin(g('d_out').value),br=nv('d_br')||0,goal=nv('d_goal');
      const clock=m=>{m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=String(Math.round(m%60)).padStart(2,'0');return `${(h%12)||12}:${mm} ${h<12?'AM':'PM'}`};
      const out=[];
      if(isFinite(a)&&isFinite(b)){
        let span=b-a;if(span<0)span+=1440;const work=Math.max(0,span-br),h=work/60;
        const q=Math.round(work/15)*15/60;
        out.push(['Hours worked',`${hm(h)}<small>${num(h,2)} h</small>`,true],['Time on the clock',`${hm(span/60)}<small>incl. ${num(br,0)} min break</small>`],['Rounded to ¼ hour',`${hm(q)}<small>${num(q,2)} h</small>`]);
        const ot=nv('d_ot'),rate=nv('d_rate');let reg=h,oth=0;
        if(isFinite(ot)&&ot>0){reg=Math.min(h,ot);oth=Math.max(0,h-ot);out.push(['Regular',`${hm(reg)}<small>${num(reg,2)} h</small>`],['Overtime',`${hm(oth)}<small>${num(oth,2)} h</small>`]);}
        if(isFinite(rate)&&rate>0){const m=x=>'$'+x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});out.push(['Pay for the day',m(reg*rate+oth*rate*1.5),true]);if(oth)out.push(['Includes overtime at 1.5×',m(oth*rate*1.5)]);}
      }
      if(isFinite(a)&&isFinite(goal)&&goal>0) out.push([`Clock out time for ${num(goal,2)} h`,clock(a+goal*60+br),true]);
      return out.length?out:null;}
  },
  timecard:{
    fields(){const v=tcDefaults();
      return `<div class="field full tc"><div class="tcgrid"><span></span><label>In</label><label>Out</label><label>Break</label>${DAYS.map((d,i)=>`<span class="tcday">${d}</span><input type="time" id="tc_in${i}" value="${v['tc_in'+i]||''}"><input type="time" id="tc_out${i}" value="${v['tc_out'+i]||''}"><input id="tc_br${i}" inputmode="numeric" value="${v['tc_br'+i]||''}" placeholder="min">`).join('')}</div></div>`
      +inp('tc_rate','Pay rate ($/hr, optional)',v.tc_rate||'')+inp('tc_ot','Overtime after (hrs/week)',v.tc_ot||'40')
      +sel('tc_mult','Overtime pay',[['1.5','1.5× (time and a half)'],['2','2× (double time)'],['1','1× (no premium)']],v.tc_mult||'1.5')
      +`<div class="field" style="justify-content:flex-end"><button class="linkbtn" id="tc_clear" type="button">Clear week</button></div>`
      +hint('Overnight shifts work: an out time earlier than the in time counts into the next day.');},
    calc(){
      const snap={};document.querySelectorAll('#convFields input,#convFields select').forEach(el=>snap[el.id]=el.value);
      try{localStorage.setItem('bb-tc',JSON.stringify(snap))}catch(e){}
      let total=0;const rows=[];
      DAYS.forEach((d,i)=>{const a=tMin(g('tc_in'+i).value),b=tMin(g('tc_out'+i).value);
        if(!isFinite(a)||!isFinite(b)) return;
        let m=b-a; if(m<0)m+=1440; m-=parseFloat(g('tc_br'+i).value)||0; m=Math.max(0,m);
        total+=m/60; rows.push([d,`${hm(m/60)}<small>${num(m/60,2)} h</small>`]);});
      if(!rows.length) return [['No shifts entered','—']];
      const otAt=nv('tc_ot')||40, reg=Math.min(total,otAt), ot=Math.max(0,total-otAt), rate=nv('tc_rate'), mult=+g('tc_mult').value;
      const out=[...rows,['Total hours',`${hm(total)}<small>${num(total,2)} h</small>`,true],['Regular',`${hm(reg)}<small>${num(reg,2)} h</small>`],['Overtime',`${hm(ot)}<small>${num(ot,2)} h</small>`]];
      if(isFinite(rate)&&rate>0){const m=x=>'$'+x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
        out.push(['Regular pay',m(reg*rate)],['Overtime pay',m(ot*rate*mult)],['Gross pay',m(reg*rate+ot*rate*mult),true]);}
      return out;}
  },
  vdrop:{

      +inp('e_v','Volts','240')+sel('e_ph','Phase',[['1','Single-phase'],['3','Three-phase']],'1')+inp('e_pf','Power factor','1')

    calc(){const k=g('e_kind').value,x=nv('e_val'),V=nv('e_v'),pf=nv('e_pf')||1,ph=g('e_ph').value==='3'?SQ3:1;
      if(!isFinite(x)||!isFinite(V)) return null;
      let VA; if(k==='A') VA=x*V*ph; else if(k==='kVA') VA=x*1000; else if(k==='VA') VA=x; else VA=(k==='W'?x:k==='kW'?x*1000:x*746)/pf;
      const W=VA*pf, A=VA/(V*ph);
      return [['Amps',num(A,2)+' A',true],['Watts',num(W,1)+' W'],['VA',num(VA,1)+' VA'],['kVA',num(VA/1000,3)+' kVA'],['Horsepower',num(W/746,2)+' HP'],['Continuous-load breaker (125%)',num(A*1.25,1)+' A min']];}

  poffset:{

  pvol:{

      +sel('m_r','Ratio (gas : oil)',[['100','100:1'],['50','50:1'],['40','40:1'],['32','32:1'],['25','25:1'],['20','20:1'],['16','16:1'],['c','Custom']],'50')+`<div class="field"><label for="m_rc">Custom ratio (X:1)</label><input id="m_rc" inputmode="decimal" placeholder="e.g. 44"></div>`
      +hint('Check your engine manual for the right ratio. Most newer handheld 2-stroke tools run 50:1.'),

    fields:()=>inp('m_tot','Cooling system capacity','2')+sel('m_cu','Unit',[['gal','Gallons'],['qt','Quarts'],['L','Liters']],'gal')
      +sel('m_pct','Mix (coolant / water)',[['30','30 / 70'],['40','40 / 60'],['50','50 / 50'],['60','60 / 40'],['70','70 / 30'],['c','Custom %']],'50')+`<div class="field"><label for="m_pc">Custom coolant %</label><input id="m_pc" inputmode="decimal" placeholder="e.g. 55"></div>`
      +hint('Freeze points are approximate for ethylene glycol concentrate. Pre-mixed 50/50 coolant should not be diluted. Follow the label.'),
    calc(){const T=nv('m_tot'),u=g('m_cu').value,p=g('m_pct').value==='c'?nv('m_pc'):+g('m_pct').value;
      if(!isFinite(T)||!isFinite(p)||p<0||p>100) return null;
      const c=T*p/100,w=T-c,un={gal:'gal',qt:'qt',L:'L'}[u];
      const pts=[[0,32],[30,4],[40,-12],[50,-34],[60,-62],[70,-84]];
      let fp=null;if(p<=70){for(let i=1;i<pts.length;i++){if(p<=pts[i][0]){const [a,fa]=pts[i-1],[b,fb]=pts[i];fp=fa+(fb-fa)*(p-a)/(b-a);break}}}
      const out=[['Coolant (concentrate)',`${num(c,2)} ${un}`,true],['Water (distilled)',`${num(w,2)} ${un}`,true],['Ratio',`${num(p,1)} : ${num(100-p,1)}`]];
      if(u!=='L') out.push(['In liters',`${num((u==='gal'?c*3.785411784:c*0.946352946),2)} L coolant + ${num((u==='gal'?w*3.785411784:w*0.946352946),2)} L water`]);
      out.push(['Freeze protection (approx.)',fp===null?'over 70% is not recommended':`${num(fp,0)} °F<small>${num((fp-32)*5/9,0)} °C</small>`]);

    fields:()=>inp('m_a','Part A','1')+inp('m_b','Part B','4')+inp('m_t','Total amount to make (optional)','',true)+hint('For example 1:4 bleach to water, or 3:1 concrete sand to cement.'),

      if(isFinite(t)&&t>0) out.push(['Amount of A',fmt(t*a/s),true],['Amount of B',fmt(t*b/s),true]);
      return out;}

    fields:()=>inp('m_p','Percent of part A','2')+inp('m_t','Total amount to make (optional)','')+hint('Example: 2% oil in gas is about 49:1. A 10% solution is 1:9.'),

  }

  $('#convFields').querySelectorAll('input,select,textarea').forEach(el=>el.addEventListener('input',runConv));
  $('#convFields').querySelectorAll('button[id$="_go"]').forEach(b=>b.onclick=runConv);
  clearInterval(untilTimer);

    g('u_quick').onclick=e=>{const b=e.target.closest('button');if(!b)return;const n=new Date();let t;
      if(b.dataset.q==='17:00'){t=new Date(n.getFullYear(),n.getMonth(),n.getDate(),17,0)}
      else if(b.dataset.q==='fri'){t=new Date(n.getFullYear(),n.getMonth(),n.getDate(),17,0);while(t.getDay()!==5||t<n)t.setDate(t.getDate()+1)}
      else if(b.dataset.q==='ny'){t=new Date(n.getFullYear()+1,0,1,0,0)}
      else{t=new Date(n.getTime()+7*864e5)}
      g('u_date').value=isoDay(t);g('u_time').value=hhmm(t);g('u_label').value=b.textContent==='1 week'?'':b.textContent;runConv()}}
  if(m==='fx'){
    g('x_swap').onclick=()=>{const f=g('x_from').value;g('x_from').value=g('x_to').value;g('x_to').value=f;g('x_rate').value='';runConv()};

  if(m==='tz'){
    g('z_now').onclick=()=>{const p=tzParts(g('z_from').value,new Date());g('z_date').value=`${p.year}-${p.month}-${p.day}`;g('z_time').value=`${p.hour}:${p.minute}`;runConv()};
    g('z_swap').onclick=()=>{const f=g('z_from').value,t=g('z_to').value,[y,mo,d]=g('z_date').value.split('-').map(Number),[h,mi]=(g('z_time').value||'00:00').split(':').map(Number);

otal tape measure", "tile": "metric floor wall ceramic porcelain", "enginehp": "car drag race", "subnet": "ip network cidr", "resistor": "color bands electronics", "bac": "alcohol drinks", "pregnancy": "due date ovulation conception period", "elecost": "kwh electric bill power"};
const ALL_TOOLS=(()=>{const t=document.createElement('template');t.innerHTML=$('#convMode').innerHTML;return [...t.content.querySelectorAll('optgroup')].map(gp=>({label:gp.label,opts:[...gp.querySelectorAll('option')].map(o=>[o.value,o.textContent])}))})();
$('#convSearch').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase().split(/\s+/).filter(Boolean),sel_=$('#convMode');let n=0,first=null;
  const h=ALL_TOOLS.map(gp=>{const hits=gp.opts.filter(([v,t])=>q.every(w=>(t+' '+gp.label+' '+v+' '+(SEARCH_KW[v]||'')).toLowerCase().includes(w)));n+=hits.length;if(hits.length&&!first)first=hits[0][0];
    return hits.length?`<optgroup label="${esc(gp.label)}">${hits.map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join('')}</optgroup>`:''}).join('');
  sel_.innerHTML=h||'<option value="" disabled>No tools match</option>';
  $('#convSearchLab').textContent=q.length?`Find a tool · ${n} match${n===1?'':'es'}`:'Find a tool';
  if(!n)return;const still=[...sel_.options].some(o=>o.value===convMode);
  if(still)sel_.value=convMode;else setConv(first);
});

$('#saveBend').onclick=e=>{
  const lines=rowsToLines($('#bendOut')); if(!lines.length) return;
  const label=document.querySelector(`#bendMode button[data-m="${bendMode}"]`).textContent;
  const inputs=snapshot($('#bendFields'));
  const summary=[...$('#bendFields').querySelectorAll('input,select')].map(el=>{const l=$('#bendFields').querySelector(`label[for="${el.id}"]`);return l?`${l.textContent.replace(/ \(in\)/,'')} ${el.tagName==='SELECT'?el.selectedOptions[0].text.split(' (')[0]:el.value}`:''}).filter(Boolean).join(', ');
  addHist({type:'bend',title:`${label} · ${summary}`,lines,mode:bendMode,inputs});
  flashSaved(e.target);
};
$('#saveConv').onclick=e=>{
  const lines=rowsToLines($('#convOut')); if(!lines.length||lines[0][1]==='—') return;
  const label=$('#convMode').selectedOptions[0].text;
  const f=$('#convFields'), v=f.querySelector('#c_v'), u=f.querySelector('#c_u');
  const title = v&&u ? `${label} · ${v.value} ${u.selectedOptions[0].text}` : label;
  addHist({type:'conv',title,lines,mode:convMode,inputs:snapshot(f)});
  flashSaved(e.target);
};
renderHist();
setBend(BEND[bendMode]?bendMode:'offset');
setConv(CONV[convMode]?convMode:'length');
showTab('calc');
